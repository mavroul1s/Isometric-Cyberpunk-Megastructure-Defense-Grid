<!DOCTYPE html>
<html lang="en" data-mode="tactical">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.tailwindcss.com"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<style>
  :root{
    --bg:#040408; --cyan:#00f0ff; --red:#ff1144; --green:#00ff66; --amber:#ffaa00;
    --accent:#00f0ff; --accent-dim:rgba(0,240,255,.35); --accent-faint:rgba(0,240,255,.09);
  }
  html[data-mode="thermal"]{ --accent:#ffaa00; --accent-dim:rgba(255,170,0,.35); --accent-faint:rgba(255,170,0,.09); }
  html[data-mode="night"]  { --accent:#00ff66; --accent-dim:rgba(0,255,102,.35); --accent-faint:rgba(0,255,102,.09); }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--accent); overflow:hidden;
    font-family:'Share Tech Mono', ui-monospace, Consolas, monospace;
    text-shadow:0 0 6px var(--accent-dim); -webkit-font-smoothing:antialiased;
    cursor:crosshair; user-select:none;
  }
  #scene{ position:absolute; inset:0; }
  canvas{ display:block; }

  #fx{ position:absolute; inset:0; pointer-events:none; z-index:10; }
  #scanlines{ position:absolute; inset:0; opacity:.15; mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.16) 0 1px, rgba(0,0,0,0) 1px 3px); transition:opacity .35s; }
  html[data-mode="night"] #scanlines{ opacity:.5; }
  #vignette{ position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 46%, rgba(0,0,0,.75) 100%); }
  #tint{ position:absolute; inset:0; opacity:0; transition:opacity .4s; mix-blend-mode:screen; }
  html[data-mode="night"] #tint{ background:radial-gradient(ellipse at center, rgba(0,255,102,.14), rgba(0,60,25,.26)); opacity:1; }
  html[data-mode="thermal"] #tint{ background:radial-gradient(ellipse at center, rgba(60,0,80,.12), rgba(20,0,40,.28)); opacity:1; }
  #alertfx{ position:absolute; inset:0; opacity:0; transition:opacity .4s; box-shadow:inset 0 0 170px rgba(255,17,68,.6); }
  #alertfx.on{ animation:apulse 1.1s ease-in-out infinite; }
  @keyframes apulse{ 0%,100%{opacity:.3} 50%{opacity:.85} }
  #svg{ position:absolute; inset:0; z-index:14; pointer-events:none; overflow:visible; }

  /* ---------- top strip ---------- */
  #strip{
    position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:18px; padding:9px 20px;
    background:linear-gradient(180deg, rgba(3,9,14,.9), rgba(3,9,14,.42));
    border:1px solid var(--accent-dim); border-top:0; backdrop-filter:blur(4px);
    box-shadow:0 6px 26px rgba(0,0,0,.7);
  }
  .stat{ display:flex; align-items:baseline; gap:5px; white-space:nowrap; }
  .stat b{ font-family:'Orbitron',monospace; font-weight:600; font-size:16px; }
  .stat s{ text-decoration:none; font-size:9.5px; opacity:.5; letter-spacing:.16em; }
  .sep{ width:1px; height:22px; background:var(--accent-faint); }
  #s-steal{ color:var(--red); font-family:'Orbitron',monospace; font-size:12px; display:none; }
  #s-steal.on{ display:inline; animation:bk .7s steps(2) infinite; }
  #threat-wrap{ display:flex; gap:2px; }
  #threat-wrap i{ width:4px; height:13px; background:rgba(255,255,255,.09); transition:.3s; }

  #auto{
    font-family:'Orbitron',monospace; font-size:9px; letter-spacing:.16em; padding:5px 10px;
    border:1px solid var(--accent-dim); cursor:pointer; transition:.15s; color:var(--accent);
  }
  #auto:hover{ background:var(--accent-faint); }
  #auto.on{ background:var(--green); color:#02060a; text-shadow:none; border-color:var(--green);
            box-shadow:0 0 14px var(--green); animation:autopulse 2.2s ease-in-out infinite; }
  @keyframes autopulse{ 0%,100%{box-shadow:0 0 10px var(--green)} 50%{box-shadow:0 0 20px var(--green)} }

  #gear{ cursor:pointer; opacity:.55; transition:.2s; font-family:'Orbitron',monospace; font-size:16px; }
  #gear:hover{ opacity:1; }
  #tray{
    position:absolute; top:100%; right:0; margin-top:6px; padding:9px;
    background:rgba(3,9,14,.94); border:1px solid var(--accent-dim); backdrop-filter:blur(5px);
    display:none; flex-direction:column; gap:6px; min-width:224px; box-shadow:0 8px 24px rgba(0,0,0,.8);
  }
  #tray.open{ display:flex; }
  .btn{
    font-family:'Orbitron',monospace; font-size:9px; letter-spacing:.15em; padding:6px 9px;
    border:1px solid var(--accent-dim); color:var(--accent); background:rgba(0,0,0,.4);
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .btn:hover{ background:var(--accent-faint); border-color:var(--accent); }
  .btn.on{ background:var(--accent); color:#02060a; text-shadow:none; }

  /* ---------- radial ---------- */
  #radial{ position:absolute; inset:0; z-index:20; pointer-events:none; }
  .act{ position:absolute; width:58px; margin:-29px 0 0 -29px; pointer-events:auto; cursor:pointer;
    text-align:center; transition:transform .12s; animation:actIn .18s cubic-bezier(.2,1.5,.4,1); }
  @keyframes actIn{ from{opacity:0;transform:scale(.4)} to{opacity:1;transform:scale(1)} }
  .act:hover{ transform:scale(1.13); }
  .act .disc{ width:52px; height:52px; margin:0 auto; border-radius:50%;
    border:1.5px solid var(--accent); background:rgba(3,12,18,.9);
    display:flex; align-items:center; justify-content:center; font-size:21px;
    box-shadow:0 0 16px var(--accent-dim), inset 0 0 14px var(--accent-faint); }
  .act .nm{ font-family:'Orbitron',monospace; font-size:7.5px; letter-spacing:.1em; margin-top:4px; opacity:.9; }
  .act .cost{ font-size:10px; margin-top:1px; }
  .act.no .disc{ border-color:rgba(255,60,90,.5); box-shadow:none; opacity:.5; }
  .act.no .cost{ color:var(--red); }
  .act.free .cost{ color:var(--green); }
  .act .tip{ font-size:8px; opacity:.55; margin-top:1px; letter-spacing:.05em; }

  /* ---------- toasts / floats ---------- */
  #toasts{ position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; flex-direction:column-reverse; align-items:center; gap:4px; pointer-events:none; }
  .toast{ font-size:11px; letter-spacing:.07em; padding:5px 14px; background:rgba(3,9,14,.82);
    border-left:2px solid var(--accent); animation:tIn .25s ease-out; white-space:nowrap; }
  .toast.out{ animation:tOut .4s ease-in forwards; }
  @keyframes tIn{ from{opacity:0;transform:translateY(9px)} to{opacity:1} }
  @keyframes tOut{ to{opacity:0;transform:translateY(-6px)} }
  .float{ position:absolute; z-index:25; pointer-events:none; font-family:'Orbitron',monospace;
    font-size:14px; font-weight:600; animation:fUp 1.1s ease-out forwards; }
  @keyframes fUp{ 0%{opacity:0;transform:translate(-50%,0) scale(.7)} 15%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-50px) scale(1)} }

  #hoverlbl{ position:absolute; z-index:22; pointer-events:none; display:none; font-size:10.5px; line-height:1.55;
    padding:5px 9px; white-space:nowrap; background:rgba(3,9,14,.92); border:1px solid var(--accent-dim); backdrop-filter:blur(3px); }
  #hint{ position:absolute; top:66px; left:50%; transform:translateX(-50%); z-index:28; font-size:11px;
    letter-spacing:.18em; opacity:0; transition:opacity .5s; pointer-events:none; text-align:center; }
  #hint.on{ opacity:.85; }
  #banner{ position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); z-index:40; text-align:center;
    pointer-events:none; opacity:0; transition:opacity .35s; }
  #banner.on{ opacity:1; }
  #banner .t{ font-family:'Orbitron',monospace; font-weight:800; font-size:29px; letter-spacing:.26em;
    color:#fff; padding:12px 38px; border-top:2px solid currentColor; border-bottom:2px solid currentColor; }
  #boot{ position:absolute; inset:0; z-index:80; background:#040408; color:var(--cyan);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    font-family:'Orbitron',monospace; letter-spacing:.3em; transition:opacity .7s; }
  #boot.gone{ opacity:0; pointer-events:none; }
  .blink{ animation:bk 1.1s steps(2) infinite; }
  @keyframes bk{ 0%,100%{opacity:1} 50%{opacity:.25} }
  input[type=range]{ -webkit-appearance:none; height:3px; background:var(--accent-dim); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px;
    background:var(--accent); box-shadow:0 0 8px var(--accent); cursor:pointer; }
</style>
</head>
<body>

<div id="scene"></div>
<div id="fx"><div id="tint"></div><div id="scanlines"></div><div id="alertfx"></div><div id="vignette"></div></div>
<svg id="svg"></svg>
<div id="radial"></div>
<div id="hoverlbl"></div>
<div id="toasts"></div>
<div id="hint"></div>
<div id="banner"><div class="t" id="banner-t"></div><div style="font-size:10px;letter-spacing:.3em;margin-top:8px" id="banner-s"></div></div>

<div id="strip">
  <div class="stat" style="color:var(--amber)"><span style="font-size:15px">⏣</span><b id="s-cred">0</b><s>CR</s></div>
  <div class="stat" style="color:var(--green)"><b id="s-rate" style="font-size:13px">+0.0</b><s>/SEC</s>
    <span id="s-steal">−0.0</span></div>
  <div class="sep"></div>
  <div class="stat"><s>SECTOR</s><b id="s-sector">1</b><s id="s-nodes" style="margin-left:3px">0 PLOTS</s></div>
  <div class="sep"></div>
  <div class="stat"><s>THREAT</s><div id="threat-wrap"></div></div>
  <div class="sep"></div>
  <div id="auto">▶ AUTO</div>
  <div style="position:relative">
    <div id="gear">⚙</div>
    <div id="tray">
      <div style="font-size:8.5px;letter-spacing:.2em;opacity:.5">OPTICS</div>
      <div style="display:flex;gap:4px">
        <button class="btn on" data-mode="tactical" style="flex:1">CYAN</button>
        <button class="btn" data-mode="thermal" style="flex:1">THERM</button>
        <button class="btn" data-mode="night" style="flex:1">NIGHT</button>
      </div>
      <div style="font-size:8.5px;letter-spacing:.2em;opacity:.5;margin-top:3px">AUDIO</div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn" id="b-audio" style="width:74px">SFX OFF</button>
        <input type="range" id="vol" min="0" max="100" value="55" style="flex:1">
      </div>
      <button class="btn" id="b-amb">AMBIENT HUM</button>
      <div style="height:1px;background:var(--accent-faint);margin:2px 0"></div>
      <button class="btn" id="b-home">RESET CAMERA</button>
      <button class="btn" id="b-restart" style="color:var(--red);border-color:rgba(255,17,68,.4)">RESTART GRID</button>
      <div style="font-size:8.5px;line-height:1.75;opacity:.5;margin-top:2px">
        <b style="color:var(--red)">BREACH</b> DRAINS YOUR CREDITS<br>
        <b style="color:var(--green)">FIREWALL</b> BLOCKS THE DRAIN<br>
        CLICK A RED NODE TO PURGE IT<br>
        PAD → BUILD · NODE → UPGRADE<br>
        SPIRE → HARVEST / EXPAND / DRONE
      </div>
    </div>
  </div>
</div>

<div id="boot">
  <div style="font-size:10px;opacity:.6">ANANKE DEFENSE SYSTEMS</div>
  <div style="font-size:23px;font-weight:800;font-family:Orbitron,monospace">SECTOR 07 — GRID EXPANSION</div>
  <div style="width:320px;height:2px;background:rgba(0,240,255,.16)"><div id="boot-bar" style="height:100%;width:0;background:#00f0ff;box-shadow:0 0 12px #00f0ff;transition:width .18s"></div></div>
  <div style="font-size:9px;opacity:.7" id="boot-txt">INITIALIZING…</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ==========================================================
   BALANCE — tuned for a fast pace
   ========================================================== */
const BAL={
  startCredits:140, startNodes:4, startDrones:4,
  maxRing:6, maxTier:5,

  band:32, minSep:21, plotsPerRing:[0,7,12,17,22,27,32],

  buildBase:42,  buildGrowth:1.085,
  upgradeBase:34, upgradeGrowth:1.72,
  fwBase:55,     fwGrowth:1.75,
  droneBase:90,  droneGrowth:1.34,
  expandBase:260, expandGrowth:2.35,
  repairMul:20,

  yieldBase:1.15, yieldTierPow:1.45,
  harvestBase:14, harvestCd:0.8,
  cacheValue:60,  cacheEvery:[9,17],
  bountyBase:42,

  intrusionEvery:[8,14], intrusionHp:4, intrusionTime:15,
  stealBase:2.6,          // CR/s drained per breach, ×sector
  stealFailMul:9,         // lump sum stolen if it times out
  fwBlockPer:0.17,        // each ICE layer blocks 17% of the drain
  fwMaxBlock:0.88,
  droneDps:0.55, droneRange:24,
  threatPerFail:20, threatPerPurge:-10, threatDecay:-1.6,

  citizens:1400, vehicles:260,
  autoTick:0.55
};

const rnd=(a,b)=>a+Math.random()*(b-a), rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=> n>=1e6?(n/1e6).toFixed(2)+'M' : n>=1e4?(n/1e3).toFixed(1)+'K' : Math.floor(n).toLocaleString();

const PAL={cyan:0x00f0ff,red:0xff1144,green:0x00ff66,amber:0xffaa00};
const MODES={
  tactical:{key:'tactical',accent:PAL.cyan,fog:0x040412,sky:0x040408,drone:PAL.amber,tube:PAL.cyan},
  thermal :{key:'thermal', accent:PAL.amber,fog:0x100612,sky:0x060206,drone:0xffffff,tube:PAL.amber},
  night   :{key:'night',   accent:PAL.green,fog:0x001a0a,sky:0x000600,drone:PAL.green,tube:PAL.green}
};
let mode=MODES.tactical;

/* ==========================================================
   AUDIO
   ========================================================== */
const A={
  ctx:null,master:null,on:false,vol:.55,ambOn:false,amb:[],
  init(){ if(this.ctx)return; const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=this.vol;
    const c=this.ctx.createDynamicsCompressor(); c.threshold.value=-14; c.ratio.value=9;
    this.master.connect(c); c.connect(this.ctx.destination); },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  vol_(v){ this.vol=v; if(this.master) this.master.gain.setTargetAtTime(v,this.ctx.currentTime,.05); },
  t({f=880,f2=null,t=.09,type='square',g=.15,d=0,lp=null,det=0}={}){
    if(!this.on||!this.ctx)return; const c=this.ctx,n=c.currentTime+d;
    const o=c.createOscillator(),gn=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,n); o.detune.value=det;
    if(f2!==null)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),n+t);
    gn.gain.setValueAtTime(.0001,n); gn.gain.exponentialRampToValueAtTime(g,n+.006);
    gn.gain.exponentialRampToValueAtTime(.0001,n+t);
    let node=o; if(lp){const b=c.createBiquadFilter();b.type='lowpass';b.frequency.value=lp;b.Q.value=4;o.connect(b);node=b;}
    node.connect(gn); gn.connect(this.master); o.start(n); o.stop(n+t+.03); },
  n({t=.14,g=.1,f=1400,q=1.2,type='bandpass'}={}){
    if(!this.on||!this.ctx)return; const c=this.ctx,now=c.currentTime;
    const len=Math.ceil(c.sampleRate*t),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(); s.buffer=b;
    const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const gn=c.createGain(); gn.gain.setValueAtTime(g,now); gn.gain.exponentialRampToValueAtTime(.0001,now+t);
    s.connect(fl); fl.connect(gn); gn.connect(this.master); s.start(now); },
  blip(){this.t({f:1320,t:.04,g:.09});},
  click(){this.t({f:660,f2:420,t:.05,g:.11});this.n({t:.04,g:.05,f:3200});},
  lock(){this.t({f:740,t:.05,g:.1});this.t({f:1100,t:.05,g:.1,d:.06});this.t({f:1560,f2:2400,t:.1,type:'sawtooth',g:.08,d:.12,lp:4200});},
  coin(){this.t({f:1180,t:.05,type:'sine',g:.13});this.t({f:1760,t:.11,type:'sine',g:.1,d:.05});this.t({f:2350,t:.14,type:'sine',g:.06,d:.1});},
  build(){this.t({f:180,f2:520,t:.22,type:'sawtooth',g:.13,lp:1800});this.n({t:.2,g:.07,f:700,type:'lowpass'});this.t({f:1400,t:.07,g:.08,d:.2});},
  up(){[0,.07,.14].forEach((d,i)=>this.t({f:520*Math.pow(1.335,i),t:.09,g:.11,d}));},
  hit(){this.t({f:2100,f2:900,t:.05,g:.12});this.n({t:.06,g:.08,f:2600});},
  purge(){this.t({f:300,f2:1700,t:.2,type:'sawtooth',g:.11,lp:3400});this.t({f:2400,t:.16,type:'sine',g:.09,d:.14});},
  steal(){this.t({f:520,f2:210,t:.16,type:'square',g:.07});},
  warn(){this.t({f:110,t:.7,type:'sawtooth',g:.1,lp:420});this.t({f:113,t:.7,type:'sawtooth',g:.1,lp:420,det:12});
    this.t({f:520,f2:180,t:.6,type:'square',g:.06,d:.05});this.n({t:.5,g:.05,f:260,type:'lowpass'});},
  fail(){this.t({f:220,f2:60,t:.6,type:'sawtooth',g:.15,lp:600});this.n({t:.5,g:.11,f:400,type:'lowpass'});},
  expand(){[0,.1,.2,.3].forEach((d,i)=>this.t({f:330*Math.pow(1.26,i),t:.3,type:'sine',g:.12,d}));
    this.t({f:80,f2:300,t:.9,type:'sawtooth',g:.1,lp:900});},
  nope(){this.t({f:180,f2:120,t:.12,g:.09});},
  ambient(s){ this.ambOn=s; if(!this.ctx)return;
    if(!s){this.amb.forEach(n=>{try{n.stop()}catch(e){}});this.amb=[];return;}
    const c=this.ctx,g=c.createGain(); g.gain.value=.032; g.connect(this.master);
    [55,82.4,110].forEach((f,i)=>{const o=c.createOscillator();o.type=i===2?'sine':'sawtooth';o.frequency.value=f;o.detune.value=(i-1)*7;
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=250;lp.Q.value=3;
      const lfo=c.createOscillator();lfo.frequency.value=.06+i*.03;const lg=c.createGain();lg.gain.value=60;
      lfo.connect(lg);lg.connect(lp.frequency);o.connect(lp);lp.connect(g);o.start();lfo.start();this.amb.push(o,lfo);}); }
};

/* ==========================================================
   THREE CORE
   ========================================================== */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040408);
scene.fog=new THREE.FogExp2(0x040412,.0042);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('scene').appendChild(renderer.domElement);

const FR=118; let aspect=(innerWidth||1)/(innerHeight||1);
const camera=new THREE.OrthographicCamera(-FR*aspect/2,FR*aspect/2,FR/2,-FR/2,-900,1400);
const HOME=new THREE.Vector3(88,76,88);
camera.position.copy(HOME); camera.zoom=1.35; camera.updateProjectionMatrix();

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06;
controls.target.set(0,7,0);
controls.minZoom=.28; controls.maxZoom=6;
controls.maxPolarAngle=Math.PI*.49; controls.minPolarAngle=.12;
controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};

scene.add(new THREE.AmbientLight(0x223344,1.1));
const rim=new THREE.PointLight(0x00f0ff,260,300,2); rim.position.set(0,30,0); scene.add(rim);

let composer=null,bloom=null;
try{
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth||1,innerHeight||1),.95,.62,.06);
  composer.addPass(bloom);
}catch(e){ composer=null; }

const world=new THREE.Group(); scene.add(world);

/* ---- ground: polar sector plates, not a city grid ---- */
const WEXT=(BAL.maxRing*BAL.band+40)*2;

/* ==========================================================
   ORGANIC PLOT PLACEMENT (rejection sampling per ring band)
   ========================================================== */
function generatePlots(ring){
  const inner=(ring-1)*BAL.band+20, outer=ring*BAL.band+20;
  const want=BAL.plotsPerRing[ring], made=[];
  let guard=0;
  while(made.length<want && guard++<900){
    const a=Math.random()*6.2832;
    const rr=Math.sqrt(lerp(inner*inner,outer*outer,Math.random()));  // uniform over annulus
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    let ok=true;
    for(const p of G.plots){ if(Math.hypot(p.x-x,p.z-z)<BAL.minSep){ ok=false; break; } }
    if(!ok) continue;
    const plot={id:G.plots.length,x,z,ring,node:null,pad:null,padLine:null};
    G.plots.push(plot); made.push(plot);
  }
  return made;
}

const padRing=new THREE.RingGeometry(4.4,5.0,26);

function makePad(p){

/* ---- roads: proximity graph, gives organic streets ---- */
function makeRoads(newPlots){
  for(const p of newPlots){
    const others=G.plots.filter(o=>o!==p).sort((a,b)=>
      Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z)).slice(0,2);
    for(const o of others){
      if(G.roads.some(r=>(r.a===p&&r.b===o)||(r.a===o&&r.b===p))) continue;
      const len=Math.hypot(o.x-p.x,o.z-p.z);
      if(len>BAL.band*1.9) continue;
      const road={a:p,b:o,len};
      const g=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(p.x,0,p.z), new THREE.Vector3(o.x,0,o.z)]);
      const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:PAL.cyan,transparent:true,opacity:.1}));
      l.position.y=.05; world.add(l); road.line=l;
      G.roads.push(road);
    }
  }
}

const ARCH=['stack','cyl','twin','zig','hex','slab','spire','dome'];
const ARCHNAME={stack:'HAB-STACK',cyl:'CYLINDER TOWER',twin:'TWIN NEXUS',zig:'ZIGGURAT PLEX',
  hex:'HEX ARCOLOGY',slab:'MONOLITH SLAB',spire:'NEEDLE SPIRE',dome:'DOME BASTION'};
const PRE={stack:'HS',cyl:'CT',twin:'TN',zig:'ZP',hex:'HX',slab:'ML',spire:'NS',dome:'DB'};

function nodeMesh(n){
  const g=new THREE.Group();
  g.userData.lines=[]; g.userData.accents=[]; g.userData.fills=[];
  const T=n.tier, s=n.seed;
  const solid=(geo,y,rotY=0)=>{
    const fill=new THREE.MeshBasicMaterial({color:0x03080e,transparent:true,opacity:.9});
    const line=new THREE.LineBasicMaterial({color:PAL.cyan,transparent:true,opacity:.75});
    const m=new THREE.Mesh(geo,fill); m.position.y=y; m.rotation.y=rotY;
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),line); e.position.y=y; e.rotation.y=rotY;
    g.add(m,e); g.userData.fills.push(fill); g.userData.lines.push(line); return m;
  };
  const glow=(geo,y,col,op=.75,rotY=0,rotX=0)=>{
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op}));
    m.position.y=y; m.rotation.y=rotY; m.rotation.x=rotX;
    g.add(m); g.userData.accents.push(m.material); return m;
  };
  let H=0;

  if(n.arch==='stack'){
    let y=0,w=7+T*.7,d=w*(.7+s*.4);
    for(let i=0;i<T+1;i++){
      const h=(5+T*2.2)*(.8+((s*9+i)%1)*.5);
      solid(new THREE.BoxGeometry(w,h,d),y+h/2); y+=h; w*=.79; d*=.79;
    }
    H=y;
    for(let i=1;i<=Math.min(4,T);i++) glow(new THREE.BoxGeometry(9+T*.7,.16,d*2.4),H/(T+1)*i,PAL.amber,.55);
  }
  else if(n.arch==='cyl'){
    const h=13+T*8, r=4.4+T*.5;
    solid(new THREE.CylinderGeometry(r*.78,r,h,12),h/2); H=h;
    for(let i=1;i<=T+1;i++) glow(new THREE.TorusGeometry(r*.95,.13,4,22),H/(T+2)*i,PAL.amber,.8,0,Math.PI/2);
    if(T>=3) solid(new THREE.CylinderGeometry(r*1.5,r*.8,2.4,12),H+1.2), H+=2.4;
  }
  else if(n.arch==='twin'){
    const h=12+T*7.5, w=3.6+T*.35, off=4.6+T*.4;
    solid(new THREE.BoxGeometry(w,h,w),h/2).position.x=-off;
    g.children[g.children.length-2].position.x=-off; g.children[g.children.length-1].position.x=-off;
    const m2=solid(new THREE.BoxGeometry(w,h*.86,w),h*.43);
    m2.position.x=off; g.children[g.children.length-1].position.x=off;
    H=h;
    for(let i=1;i<=2;i++) glow(new THREE.BoxGeometry(off*2,.7,1.5),h*(.45+i*.22),PAL.cyan,.6);
    if(T>=4) glow(new THREE.CylinderGeometry(.09,.09,h*.3,4),h*1.14,PAL.cyan,.9);
  }
  else if(n.arch==='zig'){
    let y=0,w=13+T*1.1;
    for(let i=0;i<T+2;i++){ const h=3.2+T*.7;
      solid(new THREE.BoxGeometry(w,h,w*(.85+s*.2)),y+h/2); y+=h; w*=.74; }
    H=y;
    glow(new THREE.TorusGeometry(w*.6,.12,4,18),H+.5,PAL.amber,.85,0,Math.PI/2);
  }
  else if(n.arch==='hex'){
    const h=15+T*8.5, r=5.5+T*.55;
    solid(new THREE.CylinderGeometry(r,r*1.1,h,6),h/2,Math.PI/6); H=h;
    if(T>=2) solid(new THREE.CylinderGeometry(r*.55,r*.75,h*.35,6),h+h*.175,Math.PI/6), H=h+h*.35;
    for(let i=1;i<=T;i++) glow(new THREE.TorusGeometry(r*1.02,.11,4,6),h/(T+1)*i,PAL.green,.7,Math.PI/6,Math.PI/2);
  }
  else if(n.arch==='slab'){
    const h=11+T*6.5, w=15+T*1.2, d=3.4+T*.3;
    solid(new THREE.BoxGeometry(w,h,d),h/2,s*.6); H=h;
    for(let i=0;i<4;i++) glow(new THREE.BoxGeometry(.3,h*.9,d*1.15),h/2,PAL.cyan,.5,s*.6)
      .position.set(Math.cos(s*.6)*(-w*.36+i*w*.24),h/2,-Math.sin(s*.6)*(-w*.36+i*w*.24));
    if(T>=3) glow(new THREE.BoxGeometry(w*1.02,.2,d*1.3),h*.92,PAL.amber,.8,s*.6);
  }
  else if(n.arch==='spire'){
    const h=20+T*11;
    solid(new THREE.CylinderGeometry(1.1,4.6,h,7),h/2); H=h;
    glow(new THREE.CylinderGeometry(.07,.5,h*.3,5),h+h*.15,PAL.cyan,.95); H=h*1.3;
    for(let i=1;i<=3;i++) glow(new THREE.TorusGeometry(1.6-i*.35,.08,4,16),h*(.55+i*.16),PAL.amber,.8,0,Math.PI/2);
  }
  else { /* dome */
    const r=7+T*.8, h=4+T*1.3;
    solid(new THREE.CylinderGeometry(r,r*1.08,h,14),h/2);
    solid(new THREE.SphereGeometry(r,14,7,0,6.2832,0,Math.PI/2),h); H=h+r;
    for(let i=0;i<Math.min(5,T+2);i++){
      const a=i/5*6.2832;
      glow(new THREE.CylinderGeometry(.06,.06,4+T,4),H+2,PAL.amber,.85)
        .position.set(Math.cos(a)*r*.45,H+2,Math.sin(a)*r*.45);
    }
    H+=4+T;
  }

  if(T>=4){
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.45,8,8),
      new THREE.MeshBasicMaterial({color:PAL.red,transparent:true}));
    bulb.position.y=H+1; g.add(bulb); g.userData.beacon=bulb;
  }
  /* firewall shell — how much theft this node blocks, made visible */
  if(n.fw>0){
    const rr=11+T*1.1, hh=H*1.05;
    const fm=new THREE.MeshBasicMaterial({color:PAL.green,transparent:true,
      opacity:.03+n.fw*.022,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,hh,10,1,true),fm);
    sh.position.y=hh/2; g.add(sh); g.userData.fwShell=fm;
    for(let i=0;i<n.fw && i<5;i++){
      const rm=new THREE.MeshBasicMaterial({color:PAL.green,transparent:true,opacity:.34});
      const ring=new THREE.Mesh(new THREE.TorusGeometry(rr,.09,4,28),rm);
      ring.rotation.x=Math.PI/2; ring.position.y=hh*(i+1)/(n.fw+1); g.add(ring);
      g.userData.accents.push(rm);
    }
  }
  n.height=H;
  g.position.set(n.x,0,n.z);
  g.rotation.y=n.rot;
  g.userData.node=n; g.userData.isNode=true;
  return g;
}

function styleNode(n){
  const g=n.mesh,m=mode.key;
  let lc,ac;
  if(m==='thermal'){ const t=clamp(n.tier/BAL.maxTier,0,1);
    lc=new THREE.Color().setHSL(lerp(.66,.02,t),1,lerp(.36,.56,t)); ac=lc.clone().offsetHSL(0,0,.12); }
  else if(m==='night'){ lc=new THREE.Color(PAL.green); ac=new THREE.Color(0x9dff00); }
  else { lc=new THREE.Color(PAL.cyan); ac=new THREE.Color(PAL.amber); }
  n.baseLine=lc;
  g.userData.lines.forEach(x=>{x.color.copy(lc);x.opacity=n.offline?.2:.75;});
  g.userData.accents.forEach(x=>x.color.copy(ac));
  g.userData.fills.forEach(x=>x.color.setHex(m==='thermal'?0x0a0210:m==='night'?0x001005:0x03080e));
}

function addNode(plot,silent){
  if(!plot||plot.node) return null;
  const arch=pick(ARCH);
  const n={ plot, x:plot.x, z:plot.z, tier:1, fw:0, integrity:100, offline:false,
    seed:Math.random(), flick:Math.random()*6.28, rot:Math.random()*6.2832, arch,
    desig:`${PRE[arch]}-${rndi(10,99)}-${String.fromCharCode(65+plot.ring)}${rndi(0,9)}`,
    kind:ARCHNAME[arch], height:0, stolen:0 };
  n.mesh=nodeMesh(n); world.add(n.mesh);
  plot.node=n; G.nodes.push(n);
  if(plot.pad){ world.remove(plot.pad); plot.pad=null; }
  if(plot.padLine){ world.remove(plot.padLine); plot.padLine=null; }
  styleNode(n); linkNode(n);
  if(!silent) spawnPulse(n.x,n.z,mode.accent);
  return n;
}
function rebuildNode(n){
  const old=n.mesh; world.remove(old);
  old.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
  n.mesh=nodeMesh(n); world.add(n.mesh); styleNode(n);
}

const MAXP=1100;
const pkGeo=new THREE.BufferGeometry();
pkGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MAXP*3),3));
pkGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(MAXP*3),3));

const pk=[]; for(let i=0;i<MAXP;i++) pk.push({tube:-1,t:0,sp:0,i});
let pkFree=0;

function linkNode(n){
  let best=null,bd=1e9;
  for(const o of G.nodes){ if(o===n)continue;
    const d=Math.hypot(o.x-n.x,o.z-n.z); if(d<bd){bd=d;best=o;} }
  const from=new THREE.Vector3(n.x,n.height*.92,n.z);
  const to=best?new THREE.Vector3(best.x,best.height*.92,best.z):new THREE.Vector3(0,36,0);
  if(from.distanceTo(to)>BAL.band*2.1) return;
  const mid=Math.max(from.y,to.y)+rnd(6,15);
  const curve=new THREE.CatmullRomCurve3([from,
    new THREE.Vector3(lerp(from.x,to.x,.33),mid,lerp(from.z,to.z,.33)),
    new THREE.Vector3(lerp(from.x,to.x,.66),mid,lerp(from.z,to.z,.66)),to]);
  const mat=new THREE.MeshBasicMaterial({color:mode.tube,transparent:true,opacity:.26,
    blending:THREE.AdditiveBlending,depthWrite:false});
  world.add(new THREE.Mesh(new THREE.TubeGeometry(curve,30,.1,5,false),mat));
  const ti=G.tubes.length; G.tubes.push({curve,mat});
  for(let k=0;k<9&&pkFree<MAXP;k++){ const p=pk[pkFree++]; p.tube=ti; p.t=Math.random(); p.sp=rnd(.09,.22); }
}

function makeCrowd(count,size,baseCol,speedRange,yy,spread){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(count*3),3));
  geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(count*3),3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({size,vertexColors:true,transparent:true,
    opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  world.add(pts);
  const ents=[];
  for(let i=0;i<count;i++) ents.push({road:-1,t:0,dir:1,sp:rnd(...speedRange),off:rnd(-spread,spread),y:yy+rnd(0,.6)});
  return {geo,ents,pts,baseCol};
}

function updateCrowd(c,dt,col){
  if(!G.roads.length) return;
  const pa=c.geo.attributes.position.array, ca=c.geo.attributes.color.array;
  const base=new THREE.Color(col);
  for(let i=0;i<c.ents.length;i++){
    const e=c.ents[i];
    if(e.road<0||e.road>=G.roads.length){ e.road=rndi(0,G.roads.length-1); e.t=Math.random(); e.dir=Math.random()>.5?1:-1; }
    const r=G.roads[e.road];
    e.t+=e.dir*e.sp*dt/Math.max(6,r.len)*22;
    if(e.t>1||e.t<0){ e.road=rndi(0,G.roads.length-1); e.t=e.dir>0?0:1;
      if(Math.random()<.4){ e.dir*=-1; e.t=e.dir>0?0:1; } }
    const tt=clamp(e.t,0,1);
    const dx=r.b.x-r.a.x, dz=r.b.z-r.a.z, L=Math.max(.001,Math.hypot(dx,dz));
    const px=-dz/L*e.off, pz=dx/L*e.off;
    pa[i*3]  =r.a.x+dx*tt+px;
    pa[i*3+1]=e.y;
    pa[i*3+2]=r.a.z+dz*tt+pz;
    const f=.55+Math.random()*.45;
    ca[i*3]=base.r*f; ca[i*3+1]=base.g*f; ca[i*3+2]=base.b*f;
  }
  c.geo.attributes.position.needsUpdate=true;
  c.geo.attributes.color.needsUpdate=true;
}

function spawnIntrusion(){
  const avail=G.nodes.filter(n=>!n.offline&&!n.intr);
  if(!avail.length) return;
  const n=pick(avail);
  const hp=Math.max(2,BAL.intrusionHp+Math.floor(G.sector*.5)-n.fw*.5);
  n.intr={hp,max:hp,t:BAL.intrusionTime,maxT:BAL.intrusionTime,drip:0};
  n.stolen=0;
  G.intrusions.push(n);
  A.warn();
  toast(`⚠ BREACH — ${n.desig} IS DRAINING ⏣${stealRate(n).toFixed(1)}/s`,'red');
  document.getElementById('alertfx').classList.add('on');
  G.drones.slice().sort((a,b)=>a.position.distanceTo(new THREE.Vector3(n.x,0,n.z))
    -b.position.distanceTo(new THREE.Vector3(n.x,0,n.z))).slice(0,4).forEach(d=>d.userData.target=n);
}
function hitIntrusion(n,amt,byDrone){
  if(!n.intr) return;
  n.intr.hp-=amt;
  if(!byDrone){ A.hit(); spawnPulse(n.x,n.z,PAL.red,.3); }
  if(n.intr.hp<=0) purge(n,byDrone);
}
function purge(n,byDrone){
  const stolen=n.stolen;
  n.intr=null; G.intrusions=G.intrusions.filter(x=>x!==n); G.purged++;
  const bounty=Math.floor(BAL.bountyBase*G.sector*(1+n.fw*.2)*rnd(.9,1.2));
  G.credits+=bounty; G.totalEarned+=bounty;
  floatAt(new THREE.Vector3(n.x,n.height+5,n.z),`+${bounty}`,'var(--amber)');
  G.threat=clamp(G.threat+BAL.threatPerPurge,0,100);
  A.purge(); styleNode(n);
  toast(`BREACH PURGED${byDrone?' BY DRONE':''} — LOST ⏣${Math.floor(stolen)}, BOUNTY +⏣${bounty}`,'green');
  if(!G.intrusions.length) document.getElementById('alertfx').classList.remove('on');
}
function failIntrusion(n){
  const lump=Math.floor(stealRate(n)*BAL.stealFailMul);
  G.credits=Math.max(0,G.credits-lump); G.totalStolen+=lump;
  floatAt(new THREE.Vector3(n.x,n.height+5,n.z),`−${lump}`,'var(--red)');
  n.intr=null; n.offline=true; n.integrity=clamp(n.integrity-rnd(20,38),8,100);
  G.intrusions=G.intrusions.filter(x=>x!==n); G.lost++;
  G.threat=clamp(G.threat+BAL.threatPerFail,0,100);
  A.fail(); styleNode(n);
  toast(`✖ ${n.desig} SEIZED — ⏣${lump} STOLEN · REPAIR ⏣${costRepair(n)}`,'red');
  if(!G.intrusions.length) document.getElementById('alertfx').classList.remove('on');
  if(G.threat>=100) lockdown();
}
function lockdown(){
  const loss=Math.floor(G.credits*.18);
  G.credits-=loss; G.totalStolen+=loss; G.threat=34;
  G.intrusions.slice().forEach(n=>{n.intr=null;styleNode(n);}); G.intrusions=[];
  document.getElementById('alertfx').classList.remove('on'); A.fail();
  banner('SECTOR LOCKDOWN',`THREAT CRITICAL — ⏣${fmt(loss)} SEIZED`,PAL.red,2600);
}

  closeRadial(); sel=target;
  const list=[];
  if(target.type==='pad'){
    list.push({ic:'⌁',nm:'BUILD',cost:costBuild(),tip:`+${BAL.yieldBase.toFixed(1)}/s`,run:()=>{
      if(!spend(costBuild()))return; const n=addNode(target.plot);

  } else if(target.type==='node'){

      if(!spend(costRepair(n)))return; n.offline=false; n.integrity=100; styleNode(n);
      A.up(); spawnPulse(n.x,n.z,PAL.green); toast(`${n.desig} BACK ONLINE`,'green'); openRadial(target); }});
    if(n.tier<BAL.maxTier) list.push({ic:'▲',nm:'UPGRADE',cost:costUpgrade(n),
      tip:`→ +${(BAL.yieldBase*Math.pow(n.tier+1,BAL.yieldTierPow)).toFixed(1)}/s`,run:()=>{
      if(!spend(costUpgrade(n)))return; n.tier++; rebuildNode(n); A.up(); spawnPulse(n.x,n.z,mode.accent);
      toast(`${n.desig} → TIER ${n.tier}`,'accent'); openRadial(target); }});
    else list.push({ic:'★',nm:'MAX TIER',cost:0,dis:true});
    list.push({ic:'⛨',nm:'FIREWALL '+n.fw,cost:costFw(n),col:'var(--green)',
      tip:`BLOCKS ${Math.round(fwBlock(n)*100)}%→${Math.round(Math.min(BAL.fwMaxBlock,(n.fw+1)*BAL.fwBlockPer)*100)}%`,run:()=>{
      if(!spend(costFw(n)))return; n.fw++; rebuildNode(n); A.up();
      toast(`${n.desig} ICE ${n.fw} — BLOCKS ${Math.round(fwBlock(n)*100)}% OF THEFT`,'green'); openRadial(target); }});
  } else {
    list.push({ic:'⟳',nm:'HARVEST',cost:0,free:true,run:()=>{
      if(G.harvestCd>0){A.nope();return;}
      const v=Math.floor(BAL.harvestBase*Math.pow(1.55,G.sector-1)*rnd(.85,1.3));
      G.credits+=v; G.totalEarned+=v; floatAt(new THREE.Vector3(0,50,0),`+${v}`,'var(--amber)');
      A.coin(); G.harvestCd=BAL.harvestCd; spawnPulse(0,0,PAL.amber,1.5); }});
    list.push({ic:'⊕',nm:'EXPAND',cost:costExpand(),col:'var(--green)',
      tip:G.sector>=BAL.maxRing?'MAX':`RING ${G.sector+1}`,dis:G.sector>=BAL.maxRing,
      run:()=>{ expandSector(false); openRadial(target); }});
    list.push({ic:'✈',nm:'DRONE',cost:costDrone(),tip:'AUTO-PURGE',run:()=>{
      if(!spend(costDrone()))return; addDrone(); A.build(); openRadial(target); }});
  }

    const el=document.createElement('div'); el.className='act';
    if(a.dis||(!a.free&&a.cost&&G.credits<a.cost)) el.classList.add('no');

    el.innerHTML=`<div class="disc" style="${a.col?'border-color:'+a.col+';color:'+a.col:''}">${a.ic}</div>
      <div class="nm">${a.nm}</div><div class="cost">${a.free?'FREE':a.cost?'⏣'+fmt(a.cost):''}</div>
      ${a.tip?`<div class="tip">${a.tip}</div>`:''}`;
    el.addEventListener('click',ev=>{ev.stopPropagation();A.resume();if(a.dis){A.nope();return;}if(a.run)a.run();});
    radial.appendChild(el); actions.push({el,a,idx,n:list.length});
  });
  A.lock(); positionRadial();
}
function radialAnchor(){
  if(!sel) return null;

}

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let downXY=null;
function pickAt(cx,cy){
  if(!innerWidth||!innerHeight) return null;
  ptr.x=(cx/innerWidth)*2-1; ptr.y=-(cy/innerHeight)*2+1;
  camera.updateMatrixWorld(); world.updateMatrixWorld(true);
  ray.setFromCamera(ptr,camera);
  const targets=[...G.nodes.map(n=>n.mesh),...G.caches,core];
  for(const p of G.plots) if(p.pad) targets.push(p.pad);
  const hits=ray.intersectObjects(targets,true);
  if(!hits.length) return null;
  let o=hits[0].object;
  while(o){
    if(o.userData.isCache) return {type:'cache',obj:o};
    if(o.userData.isPad)   return {type:'pad',plot:o.userData.plot};
    if(o.userData.isNode)  return {type:'node',node:o.userData.node};
    if(o.userData.isCore)  return {type:'core'};
    o=o.parent;
  }
  return null;
}
renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY)return;
  const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]); downXY=null;
  if(moved>5||e.button!==0)return;
  A.init(); A.resume();
  const h=pickAt(e.clientX,e.clientY);
  if(!h){closeRadial();return;}
  if(h.type==='cache'){grabCache(h.obj);return;}
  if(h.type==='node'&&h.node.intr){hitIntrusion(h.node,1,false);closeRadial();return;}
  if(sel&&((sel.type==='node'&&h.type==='node'&&sel.node===h.node)||
           (sel.type==='pad'&&h.type==='pad'&&sel.plot===h.plot)||
           (sel.type==='core'&&h.type==='core'))) return;
  openRadial(h);
});

/* ==========================================================
   AUTO MODE — the city runs itself
   ========================================================== */
function toggleAuto(){
  G.auto=!G.auto;
  document.getElementById('auto').classList.toggle('on',G.auto);
  document.getElementById('auto').textContent=G.auto?'■ AUTO':'▶ AUTO';
  if(G.auto){ closeRadial(); A.up();
    toast('AUTONOMOUS GOVERNANCE ENGAGED — SIT BACK','green');
    hint('AUTO MODE — THE GRID EXPANDS AND DEFENDS ITSELF',5000);
  } else { A.click(); toast('MANUAL CONTROL RESTORED','accent'); }
}
function autoStep(){
  /* 1. harvest whenever available */
  if(G.harvestCd<=0){
    const v=Math.floor(BAL.harvestBase*Math.pow(1.55,G.sector-1)*rnd(.85,1.3));
    G.credits+=v; G.totalEarned+=v; G.harvestCd=BAL.harvestCd;
    floatAt(new THREE.Vector3(0,50,0),`+${v}`,'var(--amber)');
  }
  /* 2. help the drones purge — the AI clicks too */
  if(G.intrusions.length){ hitIntrusion(G.intrusions[0],1,false); }
  /* 3. repair anything offline (cheap, restores income) */
  const broke=G.nodes.find(n=>n.offline);
  if(broke&&G.credits>=costRepair(broke)){
    G.credits-=costRepair(broke); broke.offline=false; broke.integrity=100; styleNode(broke);
    spawnPulse(broke.x,broke.z,PAL.green); return;
  }
  /* 4. buy firewall where theft hurts most, if threat is real */
  if(G.threat>28){
    const weak=G.nodes.filter(n=>n.fw<4).sort((a,b)=>b.tier-a.tier)[0];
    if(weak&&G.credits>=costFw(weak)*2.2){ G.credits-=costFw(weak); weak.fw++; rebuildNode(weak); return; }
  }
  /* 5. expand when comfortably affordable — the goal */
  if(G.sector<BAL.maxRing && G.credits>=costExpand()*1.25){ expandSector(true); return; }
  /* 6. fill empty plots */
  const free=G.plots.filter(p=>!p.node);
  if(free.length&&G.credits>=costBuild()*1.15){ addNode(pick(free)); A.build(); return; }
  /* 7. otherwise upgrade the cheapest node */
  const up=G.nodes.filter(n=>n.tier<BAL.maxTier).sort((a,b)=>costUpgrade(a)-costUpgrade(b))[0];
  if(up&&G.credits>=costUpgrade(up)*1.3){ G.credits-=costUpgrade(up); up.tier++; rebuildNode(up); }
  /* 8. more drones if the sector is big */
  if(G.drones.length<6+G.sector*2&&G.credits>=costDrone()*2.5){ G.credits-=costDrone(); addDrone(true); }
}

    let a,label;
    if(sel.type==='node'){ a=new THREE.Vector3(sel.node.x,sel.node.height/2,sel.node.z); label=sel.node.desig; }
    else if(sel.type==='pad'){ a=new THREE.Vector3(sel.plot.x,1,sel.plot.z); label='EMPTY PLOT'; }
    else { a=new THREE.Vector3(0,24,0); label='CORE SPIRE'; }
    const p=project(a);
    if(!p.behind){
      const S=sel.type==='node'?Math.max(34,sel.node.height*1.4):34;
      const x0=p.x-S,y0=p.y-S,x1=p.x+S,y1=p.y+S,L=15;
      out+=`<g stroke="${acc}" fill="none" stroke-width="1.6" style="filter:drop-shadow(0 0 5px ${acc})">
        <path d="M${x0},${y0+L} L${x0},${y0} L${x0+L},${y0}"/><path d="M${x1-L},${y0} L${x1},${y0} L${x1},${y0+L}"/>
        <path d="M${x1},${y1-L} L${x1},${y1} L${x1-L},${y1}"/><path d="M${x0+L},${y1} L${x0},${y1} L${x0},${y1-L}"/></g>
        <text x="${x0}" y="${y0-8}" font-family="Orbitron,monospace" font-size="9.5" fill="${acc}"
          letter-spacing="1.5" style="filter:drop-shadow(0 0 4px ${acc})">${label}</text>`;
    }
  }
  svg.innerHTML=out;
}

/* ==========================================================
   LOOP
   ========================================================== */
const clock=new THREE.Clock();
let stripT=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  controls.update();

  G.credits+=income()*dt;
  G.threat=clamp(G.threat+BAL.threatDecay*dt,0,100);
  G.harvestCd=Math.max(0,G.harvestCd-dt);

  /* breach drain — the money actually leaves your account */
  for(const n of G.intrusions.slice()){
    const drain=stealRate(n)*dt;
    G.credits=Math.max(0,G.credits-drain);
    n.stolen+=drain; G.totalStolen+=drain;
    n.intr.drip+=dt;
    if(n.intr.drip>.85){ n.intr.drip=0;
      floatAt(new THREE.Vector3(n.x,n.height+4,n.z),`−${Math.ceil(stealRate(n)*.85)}`,'var(--red)');
      A.steal(); }
    n.intr.t-=dt;
    if(n.intr.t<=0){ failIntrusion(n); continue; }
    const fl=Math.sin(t*11)>0;
    n.mesh.userData.lines.forEach(m=>{m.color.setHex(fl?0xff1144:0xffffff);m.opacity=1;});
  }

  if(G.nodes.length>=2){
    G.intruT-=dt;
    if(G.intruT<=0){ spawnIntrusion();
      const [a,b]=BAL.intrusionEvery; G.intruT=rnd(a,b)/(1+G.sector*.16); }
  }
  G.cacheT-=dt; if(G.cacheT<=0){ spawnCache(); G.cacheT=rnd(...BAL.cacheEvery); }

  if(G.auto){ G.autoT-=dt; if(G.autoT<=0){ G.autoT=BAL.autoTick; autoStep(); }
    controls.target.lerp(new THREE.Vector3(0,7,0),dt*.5);
    const a=t*.035, R=Math.hypot(HOME.x,HOME.z);
    camera.position.set(Math.cos(a)*R,HOME.y,Math.sin(a)*R);
  }

  /* alert rings */
  const focus=G.intrusions[0];
  ringPool.forEach((m,i)=>{
    if(!focus){m.visible=false;return;}
    m.visible=true; m.position.set(focus.x,.42,focus.z);
    const p=(t*.55+i/ringPool.length)%1;
    m.scale.setScalar(3+p*32); m.material.opacity=(1-p)*.55;
  });
  if(focus){ alertCol.visible=true; alertCol.position.set(focus.x,130,focus.z);
    alertCol.material.opacity=.05+Math.abs(Math.sin(t*3.4))*.09; }
  else alertCol.visible=false;

  /* packets */
  const pa=pkGeo.attributes.position.array, ca=pkGeo.attributes.color.array;
  const tc=new THREE.Color(mode.tube);
  for(let i=0;i<pkFree;i++){
    const p=pk[i], tb=G.tubes[p.tube]; if(!tb)continue;
    p.t+=p.sp*dt*(G.intrusions.length?1.8:1); if(p.t>1)p.t-=1;
    const v=tb.curve.getPointAt(clamp(p.t,0,1));
    pa[p.i*3]=v.x; pa[p.i*3+1]=v.y; pa[p.i*3+2]=v.z;
    const f=.6+Math.random()*.4;
    ca[p.i*3]=tc.r*f; ca[p.i*3+1]=tc.g*f; ca[p.i*3+2]=tc.b*f;
  }
  pkGeo.attributes.position.needsUpdate=true; pkGeo.attributes.color.needsUpdate=true;
  pkGeo.setDrawRange(0,pkFree);
  G.tubes.forEach((tb,i)=>tb.mat.opacity=.16+Math.sin(t*1.4+i)*.1+(G.intrusions.length?.12:0));

  updateCrowd(citizens,dt,citizens.baseCol);
  updateCrowd(vehicles,dt,vehicles.baseCol);

  /* caches */
  for(const m of G.caches.slice()){
    const tb=G.tubes[m.userData.tube];
    if(!tb){ world.remove(m); G.caches=G.caches.filter(c=>c!==m); continue; }
    m.userData.t+=dt*.11; m.userData.life-=dt;
    m.position.copy(tb.curve.getPointAt(m.userData.t%1));
    m.rotation.y+=dt*2.6; m.rotation.x+=dt*1.3;
    m.material.opacity=.55+Math.abs(Math.sin(t*5))*.45;
    if(G.auto&&Math.random()<dt*1.4){ grabCache(m); continue; }
    if(m.userData.life<=0){ world.remove(m); m.geometry.dispose(); m.material.dispose();
      G.caches=G.caches.filter(c=>c!==m); }
  }

  /* drones */
  const R=sectorRadius();
  G.drones.forEach((d,i)=>{
    const u=d.userData;
    if(u.target&&u.target.intr){
      u.ang2+=dt*1.1;
      const tg=new THREE.Vector3(u.target.x+Math.cos(u.ang2+i)*9,
        u.target.height*.8+8+Math.sin(t*1.6+i)*2, u.target.z+Math.sin(u.ang2+i)*9);
      d.position.lerp(tg,1-Math.pow(.02,dt));
      if(d.position.distanceTo(new THREE.Vector3(u.target.x,u.target.height*.8+8,u.target.z))<BAL.droneRange)
        hitIntrusion(u.target,BAL.droneDps*dt,true);
      u.mat.color.setHex(PAL.red); u.gm.color.setHex(PAL.red); u.bm.color.setHex(PAL.red);
      u.gm.opacity=.4+Math.abs(Math.sin(t*7+i))*.5;
    } else {
      if(u.target){ u.target=null; u.mat.color.setHex(mode.drone);
        u.gm.color.setHex(mode.drone); u.bm.color.setHex(mode.drone); }
      u.ang+=u.sp*dt;
      d.position.lerp(new THREE.Vector3(Math.cos(u.ang)*R*u.r*u.ecc,
        u.h+Math.sin(u.ang*3+i)*3.2, Math.sin(u.ang)*R*u.r),1-Math.pow(.06,dt));
      u.gm.opacity=.32+Math.sin(t*2.4+i)*.15;
    }
    u.core.rotation.y+=dt*2.4; u.core.rotation.x+=dt*1.2;
  });

  /* core + beacons */
  core.userData.halos[0].rotation.z+=dt*.5; core.userData.halos[1].rotation.z-=dt*.8;
  core.userData.orb.rotation.y+=dt*1.4; core.userData.orb.rotation.x+=dt*.7;
  core.userData.orb.material.color.setHex(G.harvestCd>0?0x225566:PAL.amber);
  core.userData.orb.scale.setScalar(1+Math.sin(t*3)*.06+(G.harvestCd>0?0:.1));
  core.userData.accents.forEach((m,i)=>m.opacity=.5+Math.sin(t*(1.6+i))*.3);
  G.nodes.forEach(n=>{
    if(n.mesh.userData.beacon) n.mesh.userData.beacon.material.opacity=.35+Math.abs(Math.sin(t*2+n.flick))*.65;
    if(n.mesh.userData.fwShell) n.mesh.userData.fwShell.opacity=.03+n.fw*.022+Math.sin(t*2+n.flick)*.012;
    if(n.offline&&!n.intr) n.mesh.userData.lines.forEach(m=>m.opacity=Math.random()<.06?.05:.2);
  });

  sweep.rotation.z-=dt*.45;
  boundary.material.opacity=.32+Math.sin(t*1.6)*.14;

  for(let i=pulses.length-1;i>=0;i--){
    const m=pulses[i]; m.userData.t+=dt*1.15;
    m.scale.setScalar((2+m.userData.t*30)*m.userData.s);
    m.material.opacity=Math.max(0,.85-m.userData.t);
    if(m.userData.t>1){ world.remove(m); m.geometry.dispose(); m.material.dispose(); pulses.splice(i,1); }
  }

  drawSVG(t);
  if(sel){ positionRadial(); refreshAfford(); }
  stripT+=dt; if(stripT>.1){ stripT=0; updateStrip(); }

  if(!G.won&&G.sector>=BAL.maxRing&&G.nodes.length>=G.plots.length){
    G.won=true; A.expand();
    banner('GRID COMPLETE',`SECTOR 07 INTEGRATED — ⏣${fmt(G.totalEarned)} EARNED · ⏣${fmt(G.totalStolen)} LOST`,PAL.green,8000);
  }

  if(composer) composer.render(); else renderer.render(scene,camera);
}

/* ==========================================================
   WIRING + INIT
   ========================================================== */
document.getElementById('auto').addEventListener('click',toggleAuto);
document.getElementById('gear').addEventListener('click',()=>document.getElementById('tray').classList.toggle('open'));
document.querySelectorAll('#tray [data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
const bA=document.getElementById('b-audio');
bA.addEventListener('click',()=>{A.init();A.resume();A.on=!A.on;
  bA.textContent=A.on?'SFX ON':'SFX OFF';bA.classList.toggle('on',A.on);if(A.on)A.coin();});
const bAm=document.getElementById('b-amb');
bAm.addEventListener('click',()=>{A.init();A.resume();if(!A.on){A.on=true;bA.textContent='SFX ON';bA.classList.add('on');}
  A.ambient(!A.ambOn);bAm.classList.toggle('on',A.ambOn);});
document.getElementById('vol').addEventListener('input',e=>{A.init();A.vol_(e.target.value/100);});
document.getElementById('b-home').addEventListener('click',()=>{
  camera.position.copy(HOME); controls.target.set(0,7,0);
  camera.zoom=clamp(1.35/Math.pow(1.2,G.sector-1),.28,6); camera.updateProjectionMatrix(); controls.update();});
document.getElementById('b-restart').addEventListener('click',()=>location.reload());
addEventListener('resize',()=>{
  aspect=(innerWidth||1)/(innerHeight||1);
  camera.left=-FR*aspect/2; camera.right=FR*aspect/2; camera.top=FR/2; camera.bottom=-FR/2;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  if(composer) composer.setSize(innerWidth,innerHeight);
});

const first=generatePlots(1);
first.forEach(makePad); makeRoads(first);
refreshBounds();
for(let i=0;i<BAL.startDrones;i++) addDrone(true);
{ const spots=first.slice();
  for(let i=0;i<BAL.startNodes;i++){ const p=spots.splice(rndi(0,spots.length-1),1)[0]; if(p) addNode(p,true); } }
setMode('tactical'); updateStrip(); animate();

(function boot(){
  const bar=document.getElementById('boot-bar'), txt=document.getElementById('boot-txt');
  const steps=['LINKING TO ANANKE MAINFRAME…','SURVEYING SECTOR RING 01…','ROUTING STREET NETWORK…',
    'POPULATING HAB-BLOCKS…','DEPLOYING PATROL UNITS…','GRID ONLINE'];
  let i=0;
  const iv=setInterval(()=>{
    bar.style.width=((i+1)/steps.length*100)+'%'; txt.textContent=steps[i]; i++;
    if(i>=steps.length){ clearInterval(iv);
      setTimeout(()=>{
        document.getElementById('boot').classList.add('gone');
        hint('CLICK THE CORE SPIRE TO HARVEST · CLICK EMPTY PADS TO BUILD',6500);
        setTimeout(()=>hint('A BREACH DRAINS YOUR CREDITS — CLICK THE RED NODE TO PURGE IT',6000),8000);
        setTimeout(()=>hint('BUY FIREWALLS TO BLOCK THE DRAIN · OR HIT ▶ AUTO AND WATCH',6000),16000);
      },420); }
  },220);
})();
</script>
